name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Website (lint + prerendered build + SEO checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Fails if any page breaks the SEO checks (titles, descriptions, H1, canonical)
      - run: npm run build

  api:
    name: API (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run db:seed:build
      - run: npm test
