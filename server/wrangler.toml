name = "circuitbay-api"
main = "src/worker.js"
# Once circuitbay.in is on this Cloudflare account:
# routes = [{ pattern = "api.circuitbay.in", custom_domain = true }]
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Every 10 min: release stock held by unpaid checkouts (30-min hold),
# clear expired sessions / codes / rate-limit windows
[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "circuitbay"
database_id = "f53e900e-91c3-4731-81bb-98e55976af6b"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "circuitbay-media"

# Non-secret configuration. Secrets (RAZORPAY_KEY_SECRET,
# RAZORPAY_WEBHOOK_SECRET, RESEND_API_KEY, MSG91_AUTH_KEY,
# SITE_DEPLOY_HOOK_URL, SENTRY_DSN, SHIPROCKET_PASSWORD,
# SHIPROCKET_WEBHOOK_TOKEN) are set with
# `npx wrangler secret put NAME` — never commit them here.
[vars]
APP_ENV = "production"
# No custom domain yet: set these to the workers.dev / pages.dev URLs after the
# first deploy. With the domain, use:
#   SITE_URL = "https://circuitbay.in"
#   API_PUBLIC_URL = "https://api.circuitbay.in"
#   CORS_ORIGINS = "https://circuitbay.in,https://www.circuitbay.in,https://shop.circuitbay.in"
#   COOKIE_DOMAIN = ".circuitbay.in"
SITE_URL = "https://circuit-bay-two.vercel.app"
API_PUBLIC_URL = "https://circuitbay-api.devmorphix.workers.dev"
CORS_ORIGINS = "https://circuit-bay-two.vercel.app"
# "disabled" closes checkout until Razorpay keys are added, then set "razorpay"
PAYMENTS_PROVIDER = "disabled"
# "resend" once RESEND_API_KEY is set as a secret (console = emails only in logs)
EMAIL_PROVIDER = "console"
EMAIL_FROM = "CircuitBay <hello@circuitbay.in>"
# "console" until MSG91 + DLT are approved (OTPs only appear in `wrangler tail`)
SMS_PROVIDER = "console"
ADMIN_EMAILS = "circuitbay@gmail.com,admin@circuitbay.in"
# MEDIA_PUBLIC_URL = "https://media.circuitbay.in"
# RAZORPAY_KEY_ID = "rzp_live_xxx"
# MSG91_OTP_TEMPLATE_ID = "xxx"
# RESEND_AUDIENCE_ID = "xxx"   # optional: newsletter list → Resend audience
# Courier: "manual" until Shiprocket is set up (see server/README.md)
COURIER_PROVIDER = "manual"
# SHIPROCKET_EMAIL = "api@circuitbay.in"
# SHIPROCKET_PICKUP_LOCATION = "Primary"
# SHIP_DEFAULT_WEIGHT_GRAMS = "500"
# SHIP_BOX_CM = "20x15x8"

# `wrangler dev` reads local overrides from .dev.vars (see .dev.vars.example)
